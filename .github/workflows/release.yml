name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches package.json
        id: read
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The package.json version ($version) is not x.y.z."
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the package.json version (v$version). Run npm version x.y.z and push the tag it creates."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    name: check
    needs: version
    # A called workflow cannot raise the caller's token permissions: the gate job needs actions: read.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  linux:
    name: linux
    needs: [version, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install npm 11.19.0
        run: |
          npm install -g npm@11.19.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build the deb
        run: npm run dist

      - name: Upload the deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/cais_${{ needs.version.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 7

  mac:
    name: mac
    needs: [version, check]
    # macos-15 is Apple Silicon (arm64). macos-14 is deprecated and listed as x64.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the runner architecture
        run: |
          arch="$(uname -m)"
          echo "arch: $arch"
          [ "$arch" = "arm64" ] || { echo "::error::The runner is not arm64 ($arch)."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install npm 11.19.0
        run: |
          npm install -g npm@11.19.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build the dmg
        run: npm run dist

      - name: Verify the ad-hoc signature
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Cais.app

      - name: Upload the dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/Cais-${{ needs.version.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [version, linux, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Fail if the release already exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Nothing was overwritten."
            exit 1
          fi

      - name: Download the deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: assets

      - name: Download the dmg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: assets

      - name: Write checksums and notes
        run: |
          cd assets
          sha256sum "cais_${VERSION}_amd64.deb" "Cais-${VERSION}-arm64.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          ## Install

          **Linux (Ubuntu and derivatives, x64):**

          ```bash
          sudo apt install ./cais___VERSION___amd64.deb
          ```

          **macOS (Apple Silicon):** open the `.dmg` and drag `Cais.app` to `Applications`. The app has only an ad-hoc signature, with no Apple Developer ID and no notarization, so Gatekeeper blocks the first launch. To allow it, use **System Settings › Privacy & Security › Open Anyway**, or run this in the terminal:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Cais.app
          ```

          Verify the files with `sha256sum -c --ignore-missing SHA256SUMS.txt` (on macOS, `shasum -a 256 -c --ignore-missing SHA256SUMS.txt`).

          ## Changes

          NOTES
          sed -i "s/__VERSION__/${VERSION}/g" ../notes.md

      - name: Publish the release
        run: |
          # --notes-file is prepended to the generated notes, so both are kept.
          gh release create "$TAG" \
            "assets/cais_${VERSION}_amd64.deb" \
            "assets/Cais-${VERSION}-arm64.dmg" \
            assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Cais ${VERSION}" \
            --notes-file notes.md \
            --generate-notes
