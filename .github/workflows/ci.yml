name: CI

on:
  # Every branch push runs it, PR branches included: the run shows on the PR, so a
  # pull_request trigger would only duplicate it. The gate job skips a push whose tree a
  # previous successful run already tested (a merge of an up-to-date branch, the same tree
  # pushed to another branch) and the release commit (release.yml checks it on the tag), the
  # same approach the Git project uses in its CI.
  push:
    branches: ['**']
  workflow_dispatch:
  # Reused by release.yml so a release only builds after the full check is green.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches, but never on main or in a release.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the check runs. Fails open: on any doubt, the check runs.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          TREE: ${{ github.event.head_commit.tree_id }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          finish() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "gate: run=$1 ($2)"
            echo "run=$1: $2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          case "$REF" in
            refs/tags/*) finish true "called for a tag; the release always runs the full check" ;;
          esac
          if [ "$EVENT" != "push" ]; then
            finish true "event $EVENT always runs the full check"
          fi
          first_line="${MESSAGE%%$'\n'*}"
          if [ "$REF" = "refs/heads/main" ] && [[ "$first_line" == chore\(release\):* ]]; then
            finish false "release commit; the release workflow runs the full check on this tree before building"
          fi
          if [ -z "$TREE" ]; then
            finish true "no tree id in the event"
          fi

          if ! previous="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?status=success&event=push&per_page=100" \
            --jq '[.workflow_runs[]
              | select(.head_commit.tree_id == env.TREE)
              | select(.id != (env.RUN_ID | tonumber))
              | select((.head_commit.message // "" | split("\n")[0] | startswith("chore(release):")) | not)]
              | first // empty
              | "\(.html_url) \(.head_sha)"')"; then
            finish true "could not query previous runs"
          fi
          if [ -n "$previous" ]; then
            url="${previous%% *}"
            sha="${previous##* }"
            finish false "tree $TREE already passed in $url (commit $sha)"
          fi
          finish true "no previous successful run for tree $TREE"

  check:
    name: check
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      # The lockfile and allowScripts depend on npm 11, so pin it exactly.
      - name: Install npm 11.19.0
        run: |
          npm install -g npm@11.19.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which breaks the Chromium sandbox of Electron on the hosted runner.
      # Relaxed for this job only; the app is never started with --no-sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run check
        run: xvfb-run -a npm run check

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output
          path: |
            test-results/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove leftover test containers
        if: always()
        run: docker ps -aq --filter name=cais-test- | xargs -r docker rm -f
