name: CI

on:
  # Every branch push, PR branches included: the run shows on the PR, so a pull_request
  # trigger would only run the same suite twice (the repository is private, minutes count).
  push:
    branches: ['**']
  workflow_dispatch:
  # Reused by release.yml so a release only builds after the full check is green.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches, but never on main or in a release.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      # The lockfile and allowScripts depend on npm 11, so pin it exactly.
      - name: Install npm 11.19.0
        run: |
          npm install -g npm@11.19.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which breaks the Chromium sandbox of Electron on the hosted runner.
      # Relaxed for this job only; the app is never started with --no-sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run check
        run: xvfb-run -a npm run check

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output
          path: |
            test-results/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove leftover test containers
        if: always()
        run: docker ps -aq --filter name=cais-test- | xargs -r docker rm -f
